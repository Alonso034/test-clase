<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Pruebas - Clase</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 24px; text-align: center; }
        .question { margin-bottom: 15px; font-weight: bold; margin-top: 20px; }
        .options label { display: block; margin: 6px 0; cursor: pointer; padding: 8px; background: #f8f9fa; border-radius: 4px; border: 1px solid #ddd; }
        .options label:hover { background: #e9ecef; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; }
        button:hover { background: #0056b3; }
        #result { text-align: center; font-size: 18px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Test de Autoevaluación de Clase</h1>
    
    <div class="question">1. ¿Qué herramienta se utiliza comúnmente como analizador de tráfico de red (sniffer)?</div>
    <div class="options">
        <label><input type="radio" name="q1" value="wrong"> Notepad++</label>
        <label><input type="radio" name="q1" value="correct"> Wireshark</label>
        <label><input type="radio" name="q1" value="wrong"> Git</label>
    </div>

    <div class="question">2. ¿Cuál de las siguientes es una plataforma gratuita de Google para crear webs sencillas?</div>
    <div class="options">
        <label><input type="radio" name="q2" value="correct"> Google Sites</label>
        <label><input type="radio" name="q2" value="wrong"> Google Word</label>
        <label><input type="radio" name="q2" value="wrong"> Google Excel</label>
    </div>
        
    <button onclick="calcularResultado()">Comprobar Resultados</button>

    <div id="result"></div>
</div>

<script>
    function calcularResultado() {
        let aciertos = 0;
        let total = 2; // Número total de preguntas

        // Comprobar pregunta 1
        const r1 = document.querySelector('input[name="q1"]:checked');
        if (r1 && r1.value === "correct") { aciertos++; }

        // Comprobar pregunta 2
        const r2 = document.querySelector('input[name="q2"]:checked');
        if (r2 && r2.value === "correct") { aciertos++; }

        const resultadoDiv = document.getElementById('result');
        resultadoDiv.style.color = aciertos === total ? "green" : "#d9534f";
        resultadoDiv.innerHTML = `Has acertado ${aciertos} de ${total} preguntas.`;
    }
</script>

</body>
</html>
